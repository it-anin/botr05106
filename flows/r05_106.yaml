# เปิดรายงาน R05.106 รายงานรายละเอียดบาร์โค้ดเพิ่มเติม
#
# ต่อยอดจาก flows/r05_1.yaml (ล็อกอิน + ขยาย R05.1) ไม่ต้องเขียนซ้ำ
#
# ลำดับแถวหลังขยาย R05.1 แล้ว (y = 8 + 27 * ลำดับแถว)
#     10 R05.1 (แม่ ตอนนี้เป็น -)  y=278
#     11 R05.101  y=305      14 R05.104  y=386
#     12 R05.102  y=332      15 R05.105  y=413
#     13 R05.103  y=359      16 R05.106  y=440   <- เป้าหมาย
#
# พิกัดแนวนอนของแถวลูก
#     x = 53        ไอคอนดาว - ห้ามคลิก กดโดนจะเป็นการตั้ง/ยกเลิกรายการโปรด
#     x = 68 ขึ้นไป  ตัวข้อความของรายงาน

name: r05_106
description: เปิดรายงาน R05.106 รายงานรายละเอียดบาร์โค้ดเพิ่มเติม
on_error: abort

steps:
  - action: run_flow
    name: ล็อกอินแล้วขยาย R05.1
    path: flows/r05_1.yaml

  - action: wait_window
    name: จับหน้าจอหลักไว้อ้างอิง
    as: main
    timeout: 60
    window:
      class_name: "FNWND3125"
      title: "Report Seniorsoft ProMaxx"

  # หน้าจอเงื่อนไขของรายงานโผล่ใน "กรอบขวา" ของหน้าต่างเดิม ไม่ใช่หน้าต่างใหม่
  # จึงต้องเฝ้าดูหน้าต่างหลักทั้งบาน แล้วตัดฝั่งซ้ายทิ้งด้วย change_region
  # (รายการรายงานจบที่ x=422 ในพิกัดภาพ ใช้ left: 440 เผื่อขอบ)
  #
  # ถ้าไม่ตัดฝั่งซ้าย แค่แถวถูกเลือกแล้วเปลี่ยนสีก็จะถูกนับว่า "คลิกสำเร็จ" ทันที
  # กลายเป็นผลบวกลวงที่ปิดบังกรณีคลิกพลาด
  - action: dw_click
    name: กดเมนู R05.106 รายงานรายละเอียดบาร์โค้ดเพิ่มเติม
    window: main
    datawindow: { class_name: "pbdw125", control_id: 1010 }
    at: { x: 150, y: 440 }          # แถวที่ 16 กลางข้อความ
    expect_change: true
    change_window: main
    change_region: { left: 440 }
    change_timeout: 30

  # ยืนยันแบบตรงตัว: แถบหัวเรื่องบนสุดเป็น Button จริงที่มีชื่อรายงานอยู่ข้างใน
  # แน่นอนกว่าการเทียบภาพ เพราะอ่านข้อความจากโปรแกรมโดยตรง
  - action: assert_text
    name: ยืนยันว่าเปิด R05.106 จริง
    window: main
    control: { class_name: "Button", control_id: 1011 }
    contains: "R05.106"

  - action: screenshot
    name: 01_r05_106_opened
    window: main
