# กดปุ่ม "ตกลง" ในหน้าต่างเงื่อนไขการสร้างรายงาน เพื่อออกรายงานจริง
#
# ใช้เงื่อนไขค่าเริ่มต้นคือ "สินค้าทั้งหมด" (ไม่ได้ไปแตะตัวเลือกใด ๆ)
# ถ้าจะเลือก กลุ่มสินค้า / สินค้า ต้องใช้ dw_edit กับ pbdw125 id=1000
# ในหน้าต่างเงื่อนไขก่อนถึง step กดตกลง
#
# ปุ่มในหน้าต่างเงื่อนไข
#     { class_name: "Button", title: "ตกลง" }   ยืนยัน
#     { class_name: "Button", title: "ออก" }    ยกเลิก

name: r05_106_confirm
description: กดตกลงในหน้าเงื่อนไข เพื่อออกรายงาน R05.106
on_error: abort

steps:
  - action: run_flow
    name: เปิด R05.106 แล้วกดสร้างรายงาน
    path: flows/r05_106_generate.yaml

  - action: wait_window
    name: จับหน้าจอหลักไว้อ้างอิง
    as: main
    timeout: 60
    window:
      class_name: "FNWND3125"
      title: "Report Seniorsoft ProMaxx"

  - action: wait_window
    name: จับหน้าต่างเงื่อนไขไว้อ้างอิง
    as: cond
    timeout: 60
    window:
      class_name: "FNWNS3125"
      title: "เงื่อนไขการสร้างรายงาน"

  # ตรวจถึงผลลัพธ์จริง ไม่ใช่แค่ว่า dialog ปิด -- พื้นที่แสดงรายงานในหน้าต่างหลัก
  # (pbdw125 id=1007) ต้องเปลี่ยนจากรายงานเปล่าเป็นรายงานที่มีข้อมูล
  # ใส่ทั้ง change_window และ change_control เพราะปุ่มที่กดอยู่คนละหน้าต่าง
  # กับที่ผลไปโผล่ เผื่อเวลาไว้เยอะเพราะต้องวิ่งข้อมูลสินค้าทั้งหมด
  - action: click
    name: กดปุ่มตกลง
    window: cond
    control: { class_name: "Button", title: "ตกลง" }
    method: message
    expect_change: true
    change_window: main
    change_control: { class_name: "pbdw125", control_id: 1007 }
    change_timeout: 300

  # abort_if ดักกล่องเตือน (เช่นไม่พบข้อมูล) ให้รู้ผลทันทีแทนที่จะรอจนหมดเวลา
  - action: wait_window_gone
    name: รอหน้าต่างเงื่อนไขปิด
    window: cond
    timeout: 60
    abort_if: { class_name: "#32770" }

  - action: screenshot
    name: 01_report_result
    window: main
